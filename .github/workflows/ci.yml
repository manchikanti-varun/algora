name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algora-backend
    env:
      # Keep MongoDB test binaries outside node_modules so `npm ci` does not delete the cache.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: algora-backend/package-lock.json

      - name: Cache MongoDB test binaries
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v1

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (types, lint, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algora-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: algora-frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          BACKEND_URL: "https://backend.example.invalid"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: "ci-placeholder"

      - run: npm audit --omit=dev --audit-level=high
